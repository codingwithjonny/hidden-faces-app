<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hidden Faces TV</title>
<style>
:root{--pine:#1D2E23;--bone:#F7F4EE;--gold:#E0A226;--muted:rgba(247,244,238,.62)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0B0E0C;color:var(--bone);font-family:Arial,sans-serif}
.screen{position:fixed;inset:0}.hidden{display:none!important}
#menu{padding:44px 56px 38px;background:radial-gradient(circle at 20% 0%,#35523e 0,var(--pine) 38%,#111812 100%)}
h1{margin:0 0 26px;font-size:38px}h1 small{display:block;color:var(--gold);font-size:15px;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;height:calc(100vh - 120px)}
.card{border:2px solid rgba(247,244,238,.13);border-radius:20px;background:rgba(247,244,238,.055);color:var(--bone);padding:22px 24px;text-align:left;outline:none}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 5px rgba(224,162,38,.16);transform:scale(1.025)}
.num{display:block;color:var(--gold);font-size:13px;font-weight:bold;letter-spacing:2px;margin-bottom:12px}.name{display:block;font-size:22px;font-weight:bold;line-height:1.1}
#player{background:#000}.fill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.top{position:absolute;left:28px;right:28px;top:24px;display:flex;justify-content:space-between;z-index:4;text-shadow:0 2px 10px #000;font-size:25px;font-weight:bold}
.badge{font-size:13px;background:rgba(17,24,18,.8);padding:10px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.18)}.badge b{color:var(--gold)}
.bottom{position:absolute;left:28px;right:28px;bottom:22px;display:flex;justify-content:space-between;z-index:4;color:#ddd;text-shadow:0 2px 10px #000;font-size:13px}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#1D2E23,#0B0E0C);z-index:2;text-align:center;padding:80px}#empty h2{font-size:40px;margin:0 0 14px}#empty p{font-size:19px;color:var(--muted)}
</style></head><body tabindex="0">
<section id="menu" class="screen"><h1><small>The Source</small>Hidden Faces 2026</h1><div id="grid" class="grid"></div></section>
<section id="player" class="screen hidden"><video id="video" class="fill" playsinline></video><img id="photo" class="fill" alt=""><div id="empty"><div><h2 id="emptyTitle">Loading gallery…</h2><p id="emptyText">Guest photos will appear automatically.</p></div></div><div class="top"><span id="location"></span><span id="badge" class="badge"><b>LIVE</b> Gallery</span></div><div class="bottom"><span id="status">Connected to the Hidden Faces gallery.</span><span>BACK change location</span></div></section>
<script>
(function(){
const CLOUD="ayyh0pzg",EVENT="hiddenfaces2026",GALLERY_MS=60000,PHOTO_MS=8000,REFRESH_MS=20000;
const PROFILES=[
{id:"dining",name:"Dining Hall",video:""},
{id:"admin",name:"Admin Building",video:""},
{id:"wellness",name:"Wellness Center",video:""},
{id:"education",name:"Education Building / Job Opportunities",video:""},
{id:"bowling",name:"Bowling Alley",video:""},
{id:"motion",name:"Dignity in Motion",video:""},
{id:"podcast",name:"Podcast Studio / Photo Booth",video:""},
{id:"salon",name:"Hair Salons",video:""},
{id:"gym",name:"Gym / Spa / Saunas / Pool",video:""},
{id:"living",name:"Arcade / Living Room",video:""},
{id:"chapel",name:"Future Chapel",video:""},
{id:"store",name:"General Store",video:""}
];
const $=id=>document.getElementById(id),menu=$("menu"),player=$("player"),grid=$("grid"),video=$("video"),photo=$("photo"),empty=$("empty"),emptyTitle=$("emptyTitle"),emptyText=$("emptyText"),locationEl=$("location"),badge=$("badge"),status=$("status");
let selected=Math.max(0,PROFILES.findIndex(p=>p.id===localStorage.getItem("hiddenFacesTvProfile")));let active=null,photos=[],photoIndex=0,photoTimer,phaseTimer,refreshTimer;
function render(){grid.innerHTML="";PROFILES.forEach((p,i)=>{const b=document.createElement("button");b.className="card"+(i===selected?" sel":"");b.innerHTML='<span class="num">SCREEN '+String(i+1).padStart(2,"0")+'</span><span class="name">'+p.name+'</span>';b.onclick=()=>{selected=i;start()};grid.appendChild(b);});}
function move(dx,dy){const cols=4,row=Math.floor(selected/cols),col=selected%cols;let nr=Math.max(0,Math.min(2,row+dy)),nc=Math.max(0,Math.min(3,col+dx));selected=Math.min(PROFILES.length-1,nr*cols+nc);render();}
function start(){active=PROFILES[selected];localStorage.setItem("hiddenFacesTvProfile",active.id);menu.classList.add("hidden");player.classList.remove("hidden");locationEl.textContent=active.name;clearAll();begin();refreshTimer=setInterval(fetchGallery,REFRESH_MS);}
function begin(){active&&active.video?playVideo():showGallery("Gallery mode is active. Video can be added later.");}
function playVideo(){clearTimeout(phaseTimer);clearInterval(photoTimer);photoTimer=null;photo.style.opacity=0;empty.classList.add("hidden");badge.innerHTML="<b>NOW</b> Video";status.textContent="Streaming this location's film.";video.style.display="block";video.src=active.video;video.currentTime=0;video.play().catch(()=>showGallery("Video unavailable. Gallery mode is active."));}
function releaseVideo(){try{video.pause()}catch(e){}video.removeAttribute("src");try{video.load()}catch(e){}video.style.display="none";}
function showGallery(note){clearTimeout(phaseTimer);releaseVideo();badge.innerHTML="<b>LIVE</b> Gallery";status.textContent=note||"Guest gallery • video returns in 60 seconds.";fetchGallery().finally(startPhotoRotation);phaseTimer=setTimeout(()=>{active&&active.video?playVideo():showGallery("Gallery mode is active. Video not assigned yet.");},GALLERY_MS);}
function startPhotoRotation(){clearInterval(photoTimer);photoTimer=null;if(!photos.length){empty.classList.remove("hidden");emptyTitle.textContent="Waiting for guest photos";emptyText.textContent="Photos tagged for Hidden Faces 2026 will appear automatically.";photo.style.opacity=0;return;}empty.classList.add("hidden");paintPhoto();photoTimer=setInterval(()=>{photoIndex=(photoIndex+1)%photos.length;paintPhoto();},PHOTO_MS);}
function paintPhoto(){if(!photos.length)return;photo.src=photos[photoIndex%photos.length];photo.style.opacity=1;}
async function fetchGallery(){try{const r=await fetch("https://res.cloudinary.com/"+CLOUD+"/image/list/"+EVENT+".json?_="+Math.floor(Date.now()/REFRESH_MS),{cache:"no-store"});if(r.status===404){photos=[];return}if(!r.ok)throw 0;const j=await r.json();photos=(j.resources||[]).sort((a,b)=>String(b.created_at||"").localeCompare(String(a.created_at||""))).map(x=>"https://res.cloudinary.com/"+CLOUD+"/image/upload/c_fill,w_1920,h_1080,q_auto,f_auto/"+x.public_id+".jpg");if(photos.length)empty.classList.add("hidden");}catch(e){if(!photos.length){empty.classList.remove("hidden");emptyTitle.textContent="Gallery connection interrupted";emptyText.textContent="The TV will retry automatically.";}}}
function clearAll(){clearInterval(photoTimer);clearTimeout(phaseTimer);clearInterval(refreshTimer);photoTimer=phaseTimer=refreshTimer=null;}
function back(){if(player.classList.contains("hidden"))return;clearAll();releaseVideo();player.classList.add("hidden");menu.classList.remove("hidden");render();}
video.addEventListener("ended",()=>showGallery());video.addEventListener("error",()=>{if(active&&active.video)showGallery("Video unavailable. Gallery mode is active.");});
document.addEventListener("keydown",e=>{const k=e.key||({19:"ArrowUp",20:"ArrowDown",21:"ArrowLeft",22:"ArrowRight",23:"Enter",66:"Enter"}[e.keyCode]||"");if(!player.classList.contains("hidden")){if(k==="Escape"||k==="Backspace"){e.preventDefault();back()}return;}if(k==="ArrowLeft"){e.preventDefault();move(-1,0)}else if(k==="ArrowRight"){e.preventDefault();move(1,0)}else if(k==="ArrowUp"){e.preventDefault();move(0,-1)}else if(k==="ArrowDown"){e.preventDefault();move(0,1)}else if(k==="Enter"){e.preventDefault();start()}});
window.TV={androidBack:back};render();document.body.focus();
})();
</script></body></html>
