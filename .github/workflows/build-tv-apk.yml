name: Build Hidden Faces TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/build-tv-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK 35
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk Hidden-Faces-TV-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hidden-Faces-TV-APK
          path: Hidden-Faces-TV-debug.apk
          retention-days: 90
