<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="tv-build" content="2026.10.30.2">
  <title>Hidden Faces TV</title>
  <link rel="stylesheet" href="./releases/2026.10.30.2/tv.css">
  <script type="module" src="./releases/2026.10.30.2/tv.mjs"></script>
</head>
<body>
  <main class="display" aria-label="Location slideshow and shared photos">
    <section class="slideshow" aria-label="Location slideshow">
      <img class="slide" id="slide-a" alt="">
      <img class="slide" id="slide-b" alt="">
    </section>
    <section class="photo-side" aria-label="Guest photos from tonight">
      <header class="guest-heading"><h2>Tonight, through our guests’ eyes.</h2></header>
      <div class="collage" aria-label="Live guest photo collage">
        <div class="wall" id="wall-a" aria-hidden="true"></div>
        <div class="wall" id="wall-b" aria-hidden="true"></div>
      </div>
    </section>
  </main>
</body>
</html>
