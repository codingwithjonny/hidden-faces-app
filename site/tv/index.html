<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111812">
<title>Hidden Faces TV</title>
<style>
:root{--pine:#1D2E23;--bone:#F7F4EE;--gold:#E0A226;--muted:rgba(247,244,238,.62)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0B0E0C;color:var(--bone);font-family:Arial,sans-serif}
button{font:inherit}
.screen{position:fixed;inset:0}
.hidden{display:none!important}
#menu{display:flex;flex-direction:column;padding:28px 48px 30px;background:radial-gradient(circle at 20% 0%,#35523e 0,var(--pine) 38%,#111812 100%)}
h1{flex:none;margin:0 0 18px;font-size:34px;line-height:1.05}
h1 small{display:block;color:var(--gold);font-size:13px;letter-spacing:3px;text-transform:uppercase;margin-bottom:6px}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:14px}
.card{min-height:0;border:2px solid rgba(247,244,238,.13);border-radius:18px;background:rgba(247,244,238,.055);color:var(--bone);padding:16px 20px;text-align:left;outline:none;overflow:hidden}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 5px rgba(224,162,38,.16);transform:scale(1.025)}
.num{display:block;color:var(--gold);font-size:12px;font-weight:bold;letter-spacing:2px;margin-bottom:8px}
.name{display:block;font-size:19px;font-weight:bold;line-height:1.08}
#player{background:#070907}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:none}
#youtubeWrap{position:absolute;inset:0;background:#000;display:none;opacity:0;pointer-events:none;transition:opacity .22s ease}
#youtubeWrap.on{opacity:1}
#youtubePlayer,#youtubePlayer iframe{width:100%;height:100%;border:0}
#wall{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:5px;background:#111812}
.tile{position:relative;overflow:hidden;background:linear-gradient(145deg,#24382b,#111812)}
.tile img{position:absolute;left:0;right:0;top:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.02);transition:opacity .75s ease,transform 1.1s ease,height .2s ease}
.tile img.on{opacity:1;transform:scale(1)}
.tile.has-caption img{height:calc(100% - 48px)}
.photo-caption{position:absolute;left:0;right:0;bottom:0;min-height:48px;display:none;align-items:center;padding:8px 12px;background:#152219;color:#F7F4EE;font-size:15px;line-height:1.15;font-weight:600;border-top:1px solid rgba(247,244,238,.1);overflow:hidden}
.tile.has-caption .photo-caption{display:flex}
.photo-caption span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile.empty:after{content:"Hidden Faces";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(247,244,238,.18);font-size:20px;font-weight:bold;letter-spacing:2px;text-transform:uppercase}
.wallshade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.28),transparent 20%,transparent 76%,rgba(0,0,0,.42))}
.top{position:absolute;left:28px;right:28px;top:24px;display:flex;justify-content:space-between;align-items:center;z-index:4;text-shadow:0 2px 10px #000;font-size:25px;font-weight:bold}
.badge{font-size:13px;background:rgba(17,24,18,.8);padding:10px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.18)}
.badge b{color:var(--gold)}
.bottom{position:absolute;left:28px;right:28px;bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;z-index:4;color:#eee;text-shadow:0 2px 10px #000;font-size:13px}
#status{max-width:76%}
.counter{font-weight:bold;color:#fff;white-space:nowrap}
.qr-tile{display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#F7F4EE,#E9E2D5);color:#1D2E23}
.qr-inner{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px}
.qr-inner img{display:block;width:min(58%,220px);aspect-ratio:1/1;object-fit:contain;margin-bottom:12px;border-radius:8px}
.qr-inner strong{display:block;font-size:22px;line-height:1.05;letter-spacing:.04em;text-transform:uppercase}
.qr-inner span{display:block;margin-top:7px;font-size:15px;line-height:1.25;color:rgba(29,46,35,.7);max-width:260px}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#1D2E23,#0B0E0C);z-index:2;text-align:center;padding:80px}
#empty h2{font-size:40px;margin:0 0 14px}
#empty p{font-size:19px;color:var(--muted)}
</style>
</head>
<body tabindex="0">

  <h1><small>The Source</small>Hidden Faces 2026</h1>

</section>

<section id="player" class="screen hidden">
  <video id="video" playsinline></video>

    <span id="counter" class="counter"></span>
  </div>
</section>

<script>
(function(){
"use strict";

const BUILD_ID="2026.10.07.7";
const CLOUD="ayyh0pzg";
const EVENT="hiddenfaces2026";
const GALLERY_MS=60000;
const REFRESH_MS=10000;
const VERSION_POLL_MS=30000;
const WALL_SIZE=5;

const PROFILES=[
  {id:"dining",name:"Dining Hall",playlist:[]},
  {id:"admin",name:"Admin Building",playlist:[]},
  {id:"wellness",name:"Wellness Center",playlist:[]},
  {id:"education",name:"Education Building / Job Opportunities",playlist:[]},
  {id:"bowling",name:"Bowling Alley",playlist:[]},
  {id:"motion",name:"Dignity in Motion",playlist:[]},
  {id:"podcast",name:"Podcast Studio / Photo Booth",playlist:[]},
  {id:"salon",name:"Hair Salons",playlist:[]},
  {id:"gym",name:"Gym / Spa / Saunas / Pool",playlist:[]},
  {id:"living",name:"Arcade / Living Room",playlist:[]},
  {id:"chapel",name:"Future Chapel",playlist:[]},
  {id:"store",name:"General Store",playlist:[]}
];

const $=id=>document.getElementById(id);
const menu=$("menu"),player=$("player"),grid=$("grid"),video=$("video"),youtubeWrap=$("youtubeWrap"),wall=$("wall"),empty=$("empty"),emptyTitle=$("emptyTitle"),emptyText=$("emptyText"),locationEl=$("location"),badge=$("badge"),status=$("status"),counter=$("counter");
const tiles=[...document.querySelectorAll(".tile")];

let selected=Math.max(0,PROFILES.findIndex(p=>p.id===localStorage.getItem("hiddenFacesTvProfile")));
let active=null,galleryActive=false,phaseTimer=null,refreshTimer=null,knownIds=new Set();
let playlistCursor=0,ytPlayer=null,ytApiPromise=null,ytStartGuard=null;
let ytRevealTimer=null,ytWarmupStarted=false,ytRevealed=false,ytQuality="";
let slots=tiles.map((tile,index)=>({index,tile,img:tile.querySelector("img"),captionEl:tile.querySelector(".photo-caption span"),photo:null}));

function renderMenu(){
  grid.innerHTML="";
  PROFILES.forEach((p,i)=>{
    const b=document.createElement("button");
    b.className="card"+(i===selected?" sel":"");
    b.innerHTML='<span class="num">SCREEN '+String(i+1).padStart(2,"0")+'</span><span class="name">'+p.name+'</span>';
    b.onclick=()=>{selected=i;start()};
    grid.appendChild(b);
  });
}

function move(dx,dy){
  const cols=4,row=Math.floor(selected/cols),col=selected%cols;
  let nr=Math.max(0,Math.min(2,row+dy));
  let nc=Math.max(0,Math.min(3,col+dx));
  selected=Math.min(PROFILES.length-1,nr*cols+nc);
  renderMenu();
}

function start(){
  active=PROFILES[selected];
  playlistCursor=0;
  localStorage.setItem("hiddenFacesTvProfile",active.id);
  menu.classList.add("hidden");
  player.classList.remove("hidden");
  locationEl.textContent=active.name;
  clearTimers();
  begin();
  refreshTimer=setInterval(fetchGallery,REFRESH_MS);
}

function hasMedia(profile){
  return !!(profile&&Array.isArray(profile.playlist)&&profile.playlist.length);
}

function currentMedia(){
  if(!hasMedia(active))return null;
  return active.playlist[playlistCursor%active.playlist.length];
}

function advanceMedia(){
  if(hasMedia(active))playlistCursor=(playlistCursor+1)%active.playlist.length;
}

function begin(){hasMedia(active)?playVideo():showGallery();}

function loadYouTubeApi(){
  if(window.YT&&window.YT.Player)return Promise.resolve();
  if(ytApiPromise)return ytApiPromise;
  ytApiPromise=new Promise((resolve,reject)=>{
    const previous=window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady=()=>{
      if(typeof previous==="function")try{previous()}catch(e){}
      resolve();
    };
    const s=document.createElement("script");
    s.src="https://www.youtube.com/iframe_api";
    s.async=true;
    s.onerror=()=>reject(new Error("YouTube API failed to load"));
    document.head.appendChild(s);
    setTimeout(()=>reject(new Error("YouTube API timeout")),12000);
  });
  return ytApiPromise;
}

function tryDisableCaptions(){
  if(!ytPlayer)return;
  try{
    if(typeof ytPlayer.unloadModule==="function"){
      ytPlayer.unloadModule("captions");
      ytPlayer.unloadModule("cc");
    }
  }catch(e){}
}

function qualityRank(q){
  return ({small:1,medium:2,large:3,hd720:4,hd1080:5,highres:6})[q]||0;
}

function revealYouTube(){
  if(ytRevealed||!ytPlayer)return;
  ytRevealed=true;
  clearTimeout(ytRevealTimer);
  clearTimeout(ytStartGuard);
  tryDisableCaptions();
  try{
    ytPlayer.seekTo(0,true);
    ytPlayer.unMute();
    ytPlayer.playVideo();
  }catch(e){}
  wall.classList.add("hidden");
  empty.classList.add("hidden");
  youtubeWrap.classList.add("on");
  badge.innerHTML="<b>NOW</b> Video";
  status.textContent="";
  counter.textContent="";
}

function startYouTubeWarmup(){
  if(ytWarmupStarted||!ytPlayer)return;
  ytWarmupStarted=true;
  try{
    ytPlayer.mute();
    ytPlayer.playVideo();
  }catch(e){}
  // Give YouTube a short window to adapt upward, but never hold the gallery too long.
  ytRevealTimer=setTimeout(revealYouTube,4000);
}

function youtubeStateChanged(event){
  if(!window.YT)return;
  if(event.data===YT.PlayerState.PLAYING){
    tryDisableCaptions();
    startYouTubeWarmup();
  }else if(event.data===YT.PlayerState.ENDED){
    clearTimeout(ytStartGuard);
    clearTimeout(ytRevealTimer);
    showGallery();
  }
}

function youtubeQualityChanged(event){
  ytQuality=String(event.data||"");
  if(!ytRevealed&&qualityRank(ytQuality)>=qualityRank("hd720")){
    // HD arrived quickly enough; reveal immediately instead of waiting the full warmup window.
    revealYouTube();
  }
}

function youtubeApiChanged(){
  tryDisableCaptions();
}

function youtubeError(){
  clearTimeout(ytStartGuard);
  clearTimeout(ytRevealTimer);
  status.textContent="";
  setTimeout(showGallery,700);
}

async function playYouTube(videoId){
  youtubeWrap.style.display="block";
  youtubeWrap.classList.remove("on");
  video.style.display="none";
  ytWarmupStarted=false;
  ytRevealed=false;
  ytQuality="";

  // Keep the gallery visible while YouTube starts and negotiates stream quality.
  wall.classList.remove("hidden");
  badge.innerHTML="<b>LIVE</b> Gallery";
  status.textContent="";
  counter.textContent="";

  try{
    await loadYouTubeApi();
    if(!ytPlayer){
      ytPlayer=new YT.Player("youtubePlayer",{
        videoId:videoId,
        playerVars:{
          autoplay:1,
          controls:0,
          rel:0,
          playsinline:1,
          fs:0,
          disablekb:1,
          iv_load_policy:3,
          cc_load_policy:3
        },
        events:{
          onReady:e=>{
            try{e.target.mute()}catch(err){}
            e.target.loadVideoById(videoId);
            e.target.playVideo();
          },
          onStateChange:youtubeStateChanged,
          onPlaybackQualityChange:youtubeQualityChanged,
          onApiChange:youtubeApiChanged,
          onError:youtubeError
        }
      });
    }else{
      try{ytPlayer.mute()}catch(e){}
      ytPlayer.loadVideoById(videoId);
      ytPlayer.playVideo();
    }
    clearTimeout(ytStartGuard);
    ytStartGuard=setTimeout(()=>{
      try{
        const state=ytPlayer&&ytPlayer.getPlayerState?ytPlayer.getPlayerState():-1;
        if(window.YT&&state!==YT.PlayerState.PLAYING&&state!==YT.PlayerState.BUFFERING){
          youtubeError();
        }else if(!ytRevealed){
          revealYouTube();
        }
      }catch(e){youtubeError();}
    },10000);
  }catch(e){
    youtubeError();
  }
}

function playVideo(){
  const media=currentMedia();
  if(!media){showGallery();return;}
  galleryActive=false;
  clearTimeout(phaseTimer);
  wall.classList.add("hidden");
  empty.classList.add("hidden");
  badge.innerHTML="<b>NOW</b> Video";
  status.textContent="Playing "+active.name+".";
  counter.textContent="";

  if(media.type==="youtube"&&media.id){
    playYouTube(media.id);
    return;
  }

  youtubeWrap.classList.remove("on");
  youtubeWrap.style.display="none";
  video.style.display="block";
  video.src=media.src||"";
  video.currentTime=0;
  video.play().catch(()=>youtubeError());
}

function releaseVideo(){
  clearTimeout(ytStartGuard);
  clearTimeout(ytRevealTimer);
  ytWarmupStarted=false;
  ytRevealed=false;
  try{video.pause()}catch(e){}
  video.removeAttribute("src");
  try{video.load()}catch(e){}
  video.style.display="none";
  if(ytPlayer&&ytPlayer.stopVideo){
    try{ytPlayer.stopVideo()}catch(e){}
  }
  youtubeWrap.style.display="none";
}

async function showGallery(){
  galleryActive=true;
  clearTimeout(phaseTimer);
  releaseVideo();
  wall.classList.remove("hidden");
  badge.innerHTML="<b>LIVE</b> Gallery";
  status.textContent="";
  await fetchGallery();
  if(hasMedia(active)){
    phaseTimer=setTimeout(()=>{
      if(galleryActive){
        advanceMedia();
        playVideo();
      }
    },GALLERY_MS);
  }
}

function photoUrl(id){
  return "https://res.cloudinary.com/"+CLOUD+"/image/upload/c_fill,w_900,h_600,q_auto,f_auto/"+id+".jpg";
}

function normalizeResources(resources){
  const seen=new Set();
  return (resources||[])
    .filter(r=>r&&r.public_id)
    .sort((a,b)=>String(a.created_at||"").localeCompare(String(b.created_at||"")))
    .filter(r=>{
      if(seen.has(r.public_id))return false;
      seen.add(r.public_id);
      return true;
    })
    .map(r=>({
      id:r.public_id,
      createdAt:r.created_at||"",
      url:photoUrl(r.public_id),
      caption:(r.context&&r.context.custom&&r.context.custom.caption?String(r.context.custom.caption):"").trim().slice(0,80)
    }));
}

function oldestSlot(){
  const filled=slots.filter(s=>s.photo);
  if(filled.length<WALL_SIZE)return slots.find(s=>!s.photo);
  return filled.slice().sort((a,b)=>String(a.photo.createdAt).localeCompare(String(b.photo.createdAt)))[0];
}

function renderCaption(slot,photo){
  const text=(photo&&photo.caption?photo.caption:"").trim();
  slot.tile.classList.toggle("has-caption",!!text);
  if(slot.captionEl)slot.captionEl.textContent=text;
}

function replaceSlot(slot,photo){
  if(!slot||!photo)return;
  const previous=slot.photo;
  slot.photo=photo;
  const preload=new Image();
  preload.onload=()=>{
    slot.img.classList.remove("on");
    setTimeout(()=>{
      slot.img.src=photo.url;
      slot.tile.classList.remove("empty");
      renderCaption(slot,photo);
      void slot.img.offsetWidth;
      slot.img.classList.add("on");
      updateCounter();
    },180);
  };
  preload.onerror=()=>{slot.photo=previous;renderCaption(slot,previous);updateCounter();};
  preload.src=photo.url;
}

function fillInitial(photos){
  const latest=photos.slice(-WALL_SIZE);
  slots.forEach((slot,i)=>{
    const p=latest[i];
    if(!p){
      slot.photo=null;
      slot.img.removeAttribute("src");
      slot.img.classList.remove("on");
      slot.tile.classList.add("empty");
      renderCaption(slot,null);
      return;
    }
    slot.photo=p;
    slot.tile.classList.remove("empty");
    renderCaption(slot,p);
    slot.img.src=p.url;
    slot.img.onload=()=>slot.img.classList.add("on");
  });
  updateCounter();
}

function updateCounter(){
  const n=slots.filter(s=>s.photo).length;
  counter.textContent=n+" of 5 photos";
  empty.classList.toggle("hidden",n>0);
  if(n===0){
    emptyTitle.textContent="Waiting for guest photos";
    emptyText.textContent="Photos tagged for Hidden Faces 2026 will appear here automatically.";
  }
}

function applyGallery(allPhotos){
  if(!allPhotos.length){
    if(!slots.some(s=>s.photo))updateCounter();
    return;
  }
  if(!knownIds.size){
    allPhotos.forEach(p=>knownIds.add(p.id));
    fillInitial(allPhotos);
    return;
  }
  const incoming=allPhotos.filter(p=>!knownIds.has(p.id));
  allPhotos.forEach(p=>knownIds.add(p.id));
  incoming.forEach(photo=>replaceSlot(oldestSlot(),photo));
  updateCounter();
}

async function fetchGallery(){
  if(!galleryActive)return;
  try{
    const r=await fetch("https://res.cloudinary.com/"+CLOUD+"/image/list/"+EVENT+".json?_="+Date.now(),{cache:"no-store"});
    if(r.status===404){if(!slots.some(s=>s.photo))updateCounter();return;}
    if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json();
    const photos=normalizeResources(j.resources);
    applyGallery(photos);
    const loaded=slots.filter(s=>s.photo).length;
    status.textContent="";
  }catch(e){
    if(!slots.some(s=>s.photo)){
      empty.classList.remove("hidden");
      emptyTitle.textContent="Gallery connection interrupted";
      emptyText.textContent="The TV will keep retrying automatically.";
    }
    status.textContent="";
  }
}

function clearTimers(){
  galleryActive=false;
  clearTimeout(phaseTimer);
  clearInterval(refreshTimer);
  phaseTimer=refreshTimer=null;
}

function back(){
  if(player.classList.contains("hidden"))return;
  clearTimers();
  releaseVideo();
  player.classList.add("hidden");
  menu.classList.remove("hidden");
  renderMenu();
}

async function loadConfig(){
  try{
    const r=await fetch("./config.json?_="+Date.now(),{cache:"no-store"});
    if(!r.ok)return;
    const cfg=await r.json();
    if(cfg&&cfg.profiles){
      PROFILES.forEach(p=>{
        const remote=cfg.profiles[p.id];
        if(remote&&Array.isArray(remote.playlist))p.playlist=remote.playlist;
      });
    }
  }catch(e){}
}

async function checkForUpdate(){
  try{
    const r=await fetch("./version.json?_="+Date.now(),{cache:"no-store"});
    if(!r.ok)return;
    const v=await r.json();
    if(v&&v.build&&v.build!==BUILD_ID)location.reload();
  }catch(e){}
}

video.addEventListener("ended",()=>showGallery());
video.addEventListener("error",()=>{if(active&&active.video)showGallery();});

document.addEventListener("keydown",e=>{
  const k=e.key||({19:"ArrowUp",20:"ArrowDown",21:"ArrowLeft",22:"ArrowRight",23:"Enter",66:"Enter"}[e.keyCode]||"");
  if(!player.classList.contains("hidden")){
    if(k==="Escape"||k==="Backspace"){e.preventDefault();back();}
    return;
  }
  if(k==="ArrowLeft"){e.preventDefault();move(-1,0)}
  else if(k==="ArrowRight"){e.preventDefault();move(1,0)}
  else if(k==="ArrowUp"){e.preventDefault();move(0,-1)}
  else if(k==="ArrowDown"){e.preventDefault();move(0,1)}
  else if(k==="Enter"){e.preventDefault();start()}
});

window.TV={androidBack:back};

async function init(){
  await loadConfig();
  renderMenu();
  setInterval(checkForUpdate,VERSION_POLL_MS);

  // Once a TV has been assigned a location, normal launches go straight back to it.
  const saved=localStorage.getItem("hiddenFacesTvProfile");
  if(saved&&location.search.indexOf("menu=1")===-1){
    const i=PROFILES.findIndex(p=>p.id===saved);
    if(i>=0){selected=i;setTimeout(start,350);}
  }
  document.body.focus();
}
init();
})();
</script>
</body>
